            function change(){
                if(img_count >= imgs.length){
                    img_count = 0
                } else {
                    img_count += 1
                }
                document.getElementById("timp").src = imgs[img_count]
            }
            function color_change(){
                document.getElementById("shift").style.color = document.getElementById("selected_color").value;
            }
            function add(){
                count+=1
                if(num%2==0){
                    num/=2
                } else {
                    num = 3*num + 1
                }
                document.getElementById("number").innerHTML = num
                document.getElementById("count").innerHTML = count
            }
            function hover(id){
                document.getElementById(id).style.backgroundColor = "red"
                document.getElementById(id).style.color = "white"
            }
            function unhover(id){
                document.getElementById(id).style.backgroundColor = "lightgray"
                document.getElementById(id).style.color = "black"
            }
            function popup(){
                alert("NATIONAL EMERGENCY BROADCAST SYSTEM. THIS IS NOT A DRILL.")
            }
            function show(){
                if(document.getElementById("timp").style.display == "block"){
                    document.getElementById("timp").style.display = "none"
                } else {
                    document.getElementById("timp").style.display = "block"
                }
                
            }
            //onclick onmousedown onmouseup onmouseover onmouseout
        </script>
    </head>
    <body>
        <h1 id="shift" onclick="popup()">JavaScript Notes</h1>
        <input type="color" onmouseover="hover('one')" onmouseout="unhover('one')" id="selected_color">
        <button onclick="color_change()" id="one">Click me!</button>
        <p id="number" onmouseover="show()">0</p>
        <p id="count">0</p>
        <button onclick="add()" onmouseover="hover('two')" onmouseout="unhover('two')" id="two">Increase</button>
        <br>
        <img id="timp" alt="timpanogos" src="https://www.earthdiver.com/cdn-cgi/image/width=4000,quality=75,format=auto/https://assets.earthdiver.com/media/media-2727684.jp?w=5246&h=2193&tick=1667491652923" alt="Mount Timpanogos" onmousedown="change()">
