<!--JF Styling with Color-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            body{
                padding: 25px;
            }
            #complementary{
                color: white;
                padding: 25px;
                background-color: blue;
                border: 50px solid orange;
                height: 100px;
                width: 100px;
            }
            #analogous{
                padding: 25px;
                background-color: yellow;
                border: 25px solid orange;
                outline: 25px solid orangered;
                height: 100px;
                width: 100px;
            }
            #triadic{
                color:white;
                padding: 25px;
                background-color: purple;
                border: 25px solid green;
                outline: 25px solid orange;
                height: 100px;
                width: 100px;
            }
        </style>
    </head>
    <body>
        <!--First box-->
        <div id="complementary">
            <p>Complementary</p>
        </div>
        <br> <br>
        <div id="analogous">
            <p>Analogous</p>
        </div>
        <br> <br> <br>
        <div id="triadic">
            <p>Triadic</p>
        </div>
    </body>
</html>
